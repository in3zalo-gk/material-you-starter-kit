name: Stable build and release
on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'scripts/**', '.github/workflows/stable.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Synchronize lockfile release metadata
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="web/package-lock.json"; const lock=JSON.parse(fs.readFileSync(p)); const version=JSON.parse(fs.readFileSync("web/package.json")).version; lock.version=version; lock.packages[""].version=version; fs.writeFileSync(p,JSON.stringify(lock,null,2)+"\n");'
          if ! git diff --quiet -- web/package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/package-lock.json
            git commit -m 'Sync 1.0.2 lockfile metadata [skip ci]'
            git push origin HEAD:main
          fi
      - run: npm ci --prefix web
      - run: npm audit --prefix web --audit-level=high
      - run: npm run build --prefix web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: cd web && python tests/test_web.py && python tests/test_gallery.py && python tests/test_catalog.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android assembleDebug lintDebug --stacktrace
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: m3-kit-1.0.2-verified-packages
          path: release-assets/*
          if-no-files-found: error
      - name: Publish stable only once, after checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo 'v1.0.2 already exists; keeping immutable published assets.'
          else
            gh release create v1.0.2 release-assets/* --target "$(git rev-parse HEAD)" --title 'm3 kit 1.0.2 — Stable' --notes-file docs/RELEASE-1.0.2.md --latest
          fi
